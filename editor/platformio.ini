; CYD-MicroBASIC-MicroWriter -- Freenove FNK0103N, 3.5" ST7796, ESP32-WROOM-32E.
;
; A port of MicroWriter-BASIC-PaperS3 to a much smaller board. The differences
; that govern the whole project, worth rereading before changing anything here:
;
;   PaperS3                          FNK0103N
;   ESP32-S3, 16MB flash             classic ESP32 (LX6), 4MB flash
;   8MB octal PSRAM                  no PSRAM at all
;   960x540 mono EPD, i80 parallel   480x320 colour TFT, SPI
;   GT911 capacitive touch           XPT2046 resistive touch, single point
;   BM8563 RTC                       no RTC
;
; Pins come from Freenove's own files and are repeated, with provenance, in
; src/board_fnk0103n.h. TFT_eSPI only accepts pins as -D, so the two places
; have to move together.
;
;   pio run -e fnk0103n -t upload
;   pio run -e microwriter -t upload

[platformio]
default_envs = fnk0103n
build_cache_dir = .cache

[base]
; Pinned rather than floating: an explicit version resolves the same way on
; every machine and every env, and it is the copy already cached locally.
platform = espressif32@6.12.0
; A plain WROOM-32E, with no PSRAM suffix anywhere in Freenove's material for
; this board. esp32dev is the generic profile for this family and is what the
; MSX build for this same board already uses.
board = esp32dev
framework = arduino
monitor_speed = 115200
; The CH340 on this board does not hold 921600: esptool connects, identifies
; the chip, switches baud and then dies with "Unable to verify flash chip
; connection (Serial data stream stopped)". 460800 is reliable here. Measured
; on the real board, 2026-08-31.
upload_speed = 460800

board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions.csv

build_unflags =
  -std=gnu++11

build_flags =
  -std=gnu++17

  ; --- ST7796 panel and XPT2046 touch, through TFT_eSPI ---
  ; Copied from FNK0114N_3.5_320x480_ST7796.h, the setup Freenove itself ships
  ; for this board (FNK0103N and FNK0114N are the same hardware design under
  ; different product codes). Passed as -D rather than a User_Setup.h so the
  ; library never has to be edited.
  -DUSER_SETUP_LOADED=1
  -DST7796_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=27
  -DTFT_BACKLIGHT_ON=HIGH
  -DTOUCH_CS=33
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=80000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  ; Only the built-in TFT_eSPI fonts the bring-up and the status bar actually
  ; use. The terminal's fonts are EpdFont's, generated from unscii, and never
  ; go through here. Loading all eight would spend flash for nothing on a 4MB
  ; board.
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_GFXFF=1

  ; --- Serial logging ---
  ; The WROOM-32E talks through the board's CH340, not native USB CDC, so
  ; there is no ARDUINO_USB_CDC_ON_BOOT equivalent to juggle here. The monitor
  ; always works.
  -DCORE_DEBUG_LEVEL=0
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DDISABLE_FS_H_WARNING=1

  ; --- BLE keyboard host ---
  ; The physical keyboard outranks WiFi on this device (see
  ; docs/PORTING_PLAN.md): both if they fit, and if they do not, WiFi is what
  ; goes. So this is measured first rather than last.
  ;
  ; Roles are trimmed to what a keyboard host actually needs: central and
  ; observer on, peripheral and broadcaster off. Nothing here advertises.
  ;
  ; The PaperS3 also sets CONFIG_BT_NIMBLE_EXT_ADV, and that is deliberately
  ; absent: extended advertising is a Bluetooth 5 feature and this is a classic
  ; ESP32 with a 4.2 radio. Carrying that flag across would be asking the stack
  ; for something the hardware cannot do.
  -DFREEINK_CAP_BLE_HID_HOST=1
  -DFREEINK_BLE_HID_SHOW_UNNAMED_DEVICES=0
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=1
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=1
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=4

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  h2zero/NimBLE-Arduino @ ^2.3.8

; Arduino's own Bluedroid-based BLE library would otherwise be pulled in
; alongside NimBLE and neither the flash nor the RAM has room for two stacks.
lib_ignore =
  BLE

; Milestone 1 is hardware bring-up: prove panel, touch and SD on the real
; board before porting a single feature. The PaperS3 sources sit in
; ../port-staging/ and move into src/ one at a time as each is ported. Same
; method that worked for the X4 to PaperS3 port.
build_src_filter =
  +<*>


; --- The two machines ------------------------------------------------------
; One codebase, two firmwares, so a fix in the shared parts reaches both
; without anyone having to remember to carry it. Here, unlike the PaperS3,
; only one fits on the board at a time anyway: there is a single app
; partition. Switching machines means reflashing.
;
; MicroWriter is not MicroBASIC with the prompt hidden: the interpreter and
; everything that talks to it are excluded from the build, not compiled and
; ignored.
;
; NOT BUILDABLE YET, and it stops with one #error saying so rather than a wall
; of linker failures. What it excludes is exactly what main.cpp currently draws,
; and what would replace that, text_editor.cpp, is milestone 7. The env is kept
; here rather than added later so the exclusion list stays visible while the
; files it names are being ported.

[env:fnk0103n]
extends = base

[env:microwriter]
extends = base
build_flags =
  ${base.build_flags}
  -DMICROWRITER=1
build_src_filter =
  +<*>
  -<tb_bridge.cpp>
  -<tb_runtime.cpp>
  -<screen_editor.cpp>
  -<terminal_input.cpp>
lib_ignore =
  TinyBasic
